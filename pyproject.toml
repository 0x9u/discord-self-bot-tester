[project]
name = "discord-self-bot-tester"
version = "0.2.0"
authors = [
  { name="Oliver Po", email="oliver.po2882@gmail.com" },
]
description = "A discord self-bot library to test out discord commands."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
]
license = "GPL-2.0-only"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "pydantic >= 2.13",
    "aiohttp >= 3.14"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["discord_self_bot_tester*"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/0x9u/discord-self-bot-tester"
Issues = "https://github.com/0x9u/discord-self-bot-tester/issues"